   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="15.84" y="92.46375" transform="rotate(-0 15.84 92.46375)">Machine learning</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="351.36" y="92.7675" transform="rotate(-0 351.36 92.7675)">Computer vision</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="686.88" y="92.46375" transform="rotate(-0 686.88 92.46375)">Medical image analysis</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="130.955625" transform="rotate(-0 15.84 130.955625)">22 GAN</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 159.035625)">Latent code -&gt; synthetic sample</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 178.969125)">Generator competes with critic</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 198.405)">Goal: match the data distribution</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 217.840875)">Test realism and coverage</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="131.199375" transform="rotate(-0 351.36 131.199375)">StyleGAN image synthesis</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 159.279375)">Latent styles -&gt; face image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 178.949625)">Control attributes across scales</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 198.64875)">Target scale-specific appearance</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 218.58225)">Test realism / latent coverage</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="130.955625" transform="rotate(-0 686.88 130.955625)">MedGAN PET-to-CT</text>
   </g>
   <g id="text_11">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 159.279375)">PET image -&gt; synthetic CT</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 178.949625)">Adversarial and feature losses</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 198.3855)">Target source anatomy retention</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 218.05575)">Test attenuation error / review</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="262.715625" transform="rotate(-0 15.84 262.715625)">23 Diffusion</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 290.795625)">Noise -&gt; denoised sample</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 310.2315)">Learn reversal over noise levels</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 329.667375)">Goal: learn the data distribution</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 349.3665)">Test quality / coverage / privacy</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="262.959375" transform="rotate(-0 351.36 262.959375)">Latent diffusion synthesis</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 290.795625)">Text + latent noise -&gt; image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 310.465875)">Denoise a compressed code</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 330.165)">Target content after decoding</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 350.0985)">Test prompts and fine details</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="262.715625" transform="rotate(-0 686.88 262.715625)">Medical Diffusion volumes</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 290.795625)">Noise -&gt; 3D MRI or CT</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 310.49475)">Denoising diffusion synthesis</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 330.42825)">Check anatomy / slice coherence</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 350.36175)">Test pathology / memorization</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="394.535" transform="rotate(-0 15.84 394.535)">24 Flow matching</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 422.799375)">Sample + path time -&gt; velocity</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 442.469625)">Learn source-to-data transport</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 461.9055)">Match a chosen probability path</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 481.839)">Test velocity fit / coverage</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="394.475625" transform="rotate(-0 351.36 394.475625)">Rectified-flow transformer</text>
   </g>
   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 422.555625)">Text + noise -&gt; generated image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 442.225875)">Learn transport on chosen paths</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 461.66175)">Target requested visual content</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 481.332)">Test prompts at matched cost</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="394.719375" transform="rotate(-0 686.88 394.719375)">Medical flow matching</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 422.799375)">Noise + class / mask -&gt; image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 442.732875)">Documented 2D / 3D synthesis</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 462.403125)">Target conditional anatomy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 482.336625)">Test masks and lesion fidelity</text>
   </g>
  </g>
