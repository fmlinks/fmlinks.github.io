   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #4c54a0" x="15.84" y="27.699375" transform="rotate(-0 15.84 27.699375)">07  Modeling mechanism</text>
