    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="15.84" y="92.46375" transform="rotate(-0 15.84 92.46375)">Machine learning</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="351.36" y="92.7675" transform="rotate(-0 351.36 92.7675)">Computer vision</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="686.88" y="92.46375" transform="rotate(-0 686.88 92.46375)">Medical image analysis</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="131.015" transform="rotate(-0 15.84 131.015)">16 Image</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 159.035625)">Noise -&gt; sampled intensity array</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 178.705875)">Represent image appearance</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 198.376125)">Array meaning matters, not size</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 218.309625)">Test coverage / condition fit</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="131.199375" transform="rotate(-0 351.36 131.199375)">StyleGAN face images</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 159.035625)">Latent + noise -&gt; RGB face</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 178.4715)">Vary pose and visual appearance</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 198.14175)">Raster output, not explicit mesh</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 217.577625)">Test diversity and distribution</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="131.199375" transform="rotate(-0 686.88 131.199375)">MAISI synthetic CT</text>
   </g>
   <g id="text_11">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 159.279375)">Masks + noise -&gt; 3D CT image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 178.949625)">Vary spacing and image size</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 198.883125)">Target anatomy and CT intensity</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 218.816625)">Test organ fit and intensity bias</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="262.715625" transform="rotate(-0 15.84 262.715625)">17 Texture</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 291.039375)">Noise / example -&gt; texture</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 310.47525)">Model appearance statistics</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 330.174375)">Geometry is fixed in this example</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 349.844625)">Test correlation and repetitions</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="262.715625" transform="rotate(-0 351.36 262.715625)">Text2Tex surface texture</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 290.795625)">Mesh + text -&gt; texture map</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 310.49475)">Paint from multiple viewpoints</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 329.930625)">Keep supplied mesh geometry</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 349.864125)">Test seams / view consistency</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="262.715625" transform="rotate(-0 686.88 262.715625)">Virtual stain analogy</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 291.039375)">Autofluorescence -&gt; stain image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 310.972875)">GAN changes tissue appearance</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 330.906375)">Cell layout, not a mesh UV map</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 350.576625)">Test matched stained structures</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="394.719375" transform="rotate(-0 15.84 394.719375)">18 Shape</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 422.555625)">Latent -&gt; sampled geometry</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 442.489125)">Points / mesh / occupancy / SDF</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 462.422625)">Specify coordinates and topology</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 482.092875)">Test validity and coverage</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="394.475625" transform="rotate(-0 351.36 394.475625)">PointFlow point clouds</text>
   </g>
   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 422.615)">Latent -&gt; new 3D shape</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 442.314125)">Sample points within each shape</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 462.01325)">No mesh connectivity specified</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 481.94675)">Test surface coverage / diversity</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="394.719375" transform="rotate(-0 686.88 394.719375)">CAN-FLOW cardiac anatomy</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 422.799375)">Age / sex / BMI -&gt; heart shape</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 442.732875)">Sample biventricular anatomies</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 462.16875)">Target metadata-related variation</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 482.10225)">Test phenotypes / shape validity</text>
   </g>
  </g>
