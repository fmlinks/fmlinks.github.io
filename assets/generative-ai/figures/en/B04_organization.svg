   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="15.84" y="27.699375" transform="rotate(-0 15.84 27.699375)">04  Task organization</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="57.735" transform="rotate(-0 15.84 57.735)">Figure 1 coordinate 4 | Subitems 13, 14, 15</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="15.84" y="92.46375" transform="rotate(-0 15.84 92.46375)">Machine learning</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="351.36" y="92.7675" transform="rotate(-0 351.36 92.7675)">Computer vision</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="686.88" y="92.46375" transform="rotate(-0 686.88 92.46375)">Medical image analysis</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="130.955625" transform="rotate(-0 15.84 130.955625)">13 Multitask</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 159.035625)">Several tasks -&gt; shared model</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 178.73475)">Share learning across objectives</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 198.405)">Keep separate task evaluations</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 217.840875)">Test each task versus specialists</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="130.955625" transform="rotate(-0 351.36 130.955625)">Palette generalist model</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 159.035625)">Task + input -&gt; restored image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 178.969125)">Colorize, inpaint, uncrop, restore</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 198.405)">Share conditional diffusion</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 217.840875)">Test each task, not their average</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="131.199375" transform="rotate(-0 686.88 131.199375)">AortaDiff shared objectives</text>
   </g>
   <g id="text_11">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 159.279375)">Plain CT -&gt; synthetic CT / masks</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 179.212875)">Synthesis + segmentation tasks</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 198.883125)">Target shared anatomical identity</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 218.816625)">Test image / Dice / size error</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="262.715625" transform="rotate(-0 15.84 262.715625)">14 Multimodal</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 291.039375)">Different modalities -&gt; modeling</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 310.709625)">Link language and visual content</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 330.643125)">Conditioning is not joint sampling</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 350.313375)">Test cross-modal agreement</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="262.959375" transform="rotate(-0 351.36 262.959375)">UniDiffuser image and text</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 290.795625)">Text -&gt; image; image -&gt; text</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 310.465875)">Also supports paired sampling</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 330.399375)">Specify the sampling mode</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 350.069625)">Test alignment in each mode</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="262.715625" transform="rotate(-0 686.88 262.715625)">UniX reports and X-rays</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 290.795625)">Report -&gt; X-ray; X-ray -&gt; report</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 310.465875)">Generate across distinct formats</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 330.165)">Target findings, not patient ID</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 349.83525)">Test omissions / contradictions</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="394.535" transform="rotate(-0 15.84 394.535)">15 Joint generation</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 422.555625)">Noise -&gt; corresponding outputs</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 442.225875)">Learn how outputs depend</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 461.66175)">Describe one shared sample</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 481.097625)">Test pairs and individual outputs</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="394.719375" transform="rotate(-0 351.36 394.719375)">JointNet RGB and depth</text>
   </g>
   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 422.799375)">Text + noise -&gt; RGB-depth pair</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 442.4985)">Couple two diffusion branches</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 461.934375)">Target matching scene geometry</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 481.604625)">Test edges and pair consistency</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="394.719375" transform="rotate(-0 686.88 394.719375)">MedSegFactory image / mask</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 422.555625)">Text + noise -&gt; image-mask pair</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 442.225875)">Cross-condition two streams</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 461.925)">Target matching anatomy / labels</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 481.8585)">Test boundaries / real-task utility</text>
   </g>
  </g>
 </g>
