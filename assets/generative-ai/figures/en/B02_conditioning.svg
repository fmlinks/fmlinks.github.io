   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="15.84" y="27.81" transform="rotate(-0 15.84 27.81)">02  Conditioning and control</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="57.735" transform="rotate(-0 15.84 57.735)">Figure 1 coordinate 2 | Subitems 07, 08, 09</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="15.84" y="92.46375" transform="rotate(-0 15.84 92.46375)">Machine learning</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="351.36" y="92.7675" transform="rotate(-0 351.36 92.7675)">Computer vision</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="686.88" y="92.46375" transform="rotate(-0 686.88 92.46375)">Medical image analysis</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="130.955625" transform="rotate(-0 15.84 130.955625)">07 Conditional</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 159.279375)">Condition + noise -&gt; samples</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 178.71525)">Select a conditional distribution</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 198.151125)">Keep given context, vary detail</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 217.821375)">Test adherence and diversity</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="131.199375" transform="rotate(-0 351.36 131.199375)">SPADE layout to scene</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 159.279375)">Street layout -&gt; scene image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 179.212875)">Condition on semantic regions</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 198.883125)">Keep layout; vary appearance</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 218.816625)">Test layout fit and realism</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="131.199375" transform="rotate(-0 686.88 131.199375)">MAISI anatomy to CT</text>
   </g>
   <g id="text_11">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 159.291875)">Organ masks + spacing -&gt; CT</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 179.225375)">Generate a synthetic 3D volume</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 198.895625)">Target requested anatomy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 218.829125)">Test masks and CT plausibility</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="262.715625" transform="rotate(-0 15.84 262.715625)">08 Text-conditioned</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 290.795625)">Text -&gt; new visual samples</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 310.49475)">Words specify desired content</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 330.42825)">Keep named attributes / relations</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 349.864125)">Test response to prompt edits</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="262.715625" transform="rotate(-0 351.36 262.715625)">Imagen text to scene</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 290.795625)">Text -&gt; generated scene</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 310.465875)">Example: red cubes, blue ball</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 329.90175)">Target count, color, position</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 349.83525)">Test object / relation accuracy</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="262.959375" transform="rotate(-0 686.88 262.959375)">RoentGen text to X-ray</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 290.795625)">Radiology prompt -&gt; radiograph</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 310.729125)">Generate, not retrieve, an image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 330.662625)">Target findings and anatomy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 350.596125)">Test independent finding review</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="394.475625" transform="rotate(-0 15.84 394.475625)">09 Controllable</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 422.799375)">Chosen factor -&gt; steered sample</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 442.4985)">Change one requested property</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 462.16875)">Fix other inputs where possible</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 481.604625)">Test control and unwanted drift</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="394.719375" transform="rotate(-0 351.36 394.719375)">ControlNet spatial steering</text>
   </g>
   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 422.799375)">Pose / edges / depth -&gt; image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 442.732875)">Guide the generated structure</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 462.403125)">Vary appearance, retain control</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 482.336625)">Test alignment / off-target drift</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="394.719375" transform="rotate(-0 686.88 394.719375)">MAISI anatomical steering</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 422.799375)">Selected organ mask -&gt; CT</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 442.469625)">Anatomy control, not causation</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 462.139875)">Target the requested mask shape</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 482.073375)">Test changed / other structures</text>
   </g>
  </g>
 </g>
