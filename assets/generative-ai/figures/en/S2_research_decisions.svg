   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start" x="21.6" y="35.01" transform="rotate(-0 21.6 35.01)">General evidence-reading workflow</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Arial'; text-anchor: start" x="21.6" y="72.855" transform="rotate(-0 21.6 72.855)">Context of use | Comparable conditions | Scope of the evidence</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="21.6" y="117.699375" transform="rotate(-0 21.6 117.699375)">1  Understand the setting</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 180.58725)">Input and required output</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 200.286375)">Reported context of use</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 219.9855)">Reference and study design</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 239.919)">What was actually measured?</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="21.6" y="325.584375" transform="rotate(-0 21.6 325.584375)">Read the result in context</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 405.735188)">Avoid extrapolating</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 425.405438)">to an untested application</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="360" y="117.81" transform="rotate(-0 360 117.81)">2  Compare fairly</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 180.95325)">Data and supervision</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 200.652375)">Splits and test conditions</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 220.3515)">Computational resources</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 239.787375)">Relevant comparison methods</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="360" y="325.657812" transform="rotate(-0 360 325.657812)">Are the protocols comparable?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 405.852375)">Keep unmatched conditions</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 425.28825)">visible in the comparison</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="698.4" y="117.82125" transform="rotate(-0 698.4 117.82125)">3  Bound the conclusion</text>
   </g>
   <g id="text_12">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 181.104)">Independent reference</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 200.539875)">Reported outcome and error</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 219.97575)">Assumptions and uncertainty</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 239.646)">Known study limitations</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="698.4" y="325.526563" transform="rotate(-0 698.4 325.526563)">What is actually supported?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 405.842625)">Separate observations</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 425.54175)">from broader interpretation</text>
   </g>
  </g>
 </g>
