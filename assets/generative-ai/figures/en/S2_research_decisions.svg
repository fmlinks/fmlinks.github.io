   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start" x="21.6" y="34.86375" transform="rotate(-0 21.6 34.86375)">From a literature gap to a decisive research pilot</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Arial'; text-anchor: start" x="21.6" y="72.855" transform="rotate(-0 21.6 72.855)">General research-selection workflow | Four medical cases are developed in the text</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="21.6" y="117.81" transform="rotate(-0 21.6 117.81)">1  Specify the need</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 181.099312)">Population and input</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 200.535188)">Required invariant</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 219.971063)">Decision-changing error</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 239.641313)">Available independent truth</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="21.6" y="325.584375" transform="rotate(-0 21.6 325.584375)">Can this error be measured?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 405.852375)">No -&gt; narrower claim</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 425.28825)">or build a validation resource</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="360" y="117.81" transform="rotate(-0 360 117.81)">2  Verify the increment</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 180.352875)">Nearest work + synonyms</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 200.286375)">What already exists?</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 220.219875)">Missing capability or evidence?</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 240.153375)">Strong conventional baseline</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="360" y="325.584375" transform="rotate(-0 360 325.584375)">Is the increment testable?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 405.735188)">No -&gt; revise the question</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 425.171063)">not just the model name</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="698.4" y="117.82125" transform="rotate(-0 698.4 117.82125)">3  Run a bounded test</text>
   </g>
   <g id="text_12">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 180.8505)">Freeze split and endpoint</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 200.286375)">Include plausible wrong controls</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 219.956625)">Match data and compute access</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 239.65575)">Prespecify a stopping rule</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'" transform="translate(698.4 315.669938)">Does the pilot change</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'" transform="translate(698.4 335.498812)">the consequential result?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 405.852375)">No -&gt; stop or narrow</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 425.28825)">Yes -&gt; ablate, then scale</text>
   </g>
  </g>
 </g>
