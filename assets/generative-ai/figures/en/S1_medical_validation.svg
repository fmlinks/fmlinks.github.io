   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 191.056312)">Acquisition / reconstruction</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 210.492188)">Accelerated MRI or CT</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 229.928063)">Measured operator + noise</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 190.802812)">Acquired data + local truth</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 210.501937)">Held-out patients / scanners</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 229.937813)">Reader or quantitative test</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 190.934438)">Lesion / measurement error</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 210.370313)">Acceptance and reacquisition</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(698.4 229.806187)">Total time and fallback</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 323.90475)">Translation / staining</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 343.575)">MR-only RT or virtual histology</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(21.6 363.24525)">Preserve identity and biology</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 323.773125)">Dose / positioning reference</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 343.443375)">Registered tissue + readers</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(360 363.376875)">Finding-specific disagreement</text>
   </g>
   <g id="text_11">
