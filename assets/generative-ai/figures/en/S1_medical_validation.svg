    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start" x="21.6" y="35.02125" transform="rotate(-0 21.6 35.02125)">Selected medical workflows: where validation enters</text>
   </g>
   <g id="text_2">
