   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="15.84" y="27.856875" transform="rotate(-0 15.84 27.856875)">01  Task operation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="57.735" transform="rotate(-0 15.84 57.735)">Figure 1 coordinate 1 | Subitems 01, 02, 03, 04, 05, 06</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #2573b4" x="15.84" y="92.46375" transform="rotate(-0 15.84 92.46375)">Machine learning</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #148843" x="351.36" y="92.7675" transform="rotate(-0 351.36 92.7675)">Computer vision</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: start; fill: #68559d" x="686.88" y="92.46375" transform="rotate(-0 686.88 92.46375)">Medical image analysis</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="131.199375" transform="rotate(-0 15.84 131.199375)">01 Synthesis</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 159.035625)">Noise + condition -&gt; new sample</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 178.4715)">Learn a sample distribution</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 197.907375)">Keep requested properties</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 217.34325)">Test coverage and diversity</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="131.199375" transform="rotate(-0 351.36 131.199375)">Image / texture / shape</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 159.279375)">Noise / prompt -&gt; visual sample</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 178.71525)">LDM; Text2Tex</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 198.151125)">Keep requested attributes</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 217.85025)">Test fidelity and coverage</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="131.199375" transform="rotate(-0 686.88 131.199375)">MAISI synthetic CT</text>
   </g>
   <g id="text_11">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 159.035625)">Masks / metadata -&gt; CT volume</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 178.4715)">Vary appearance, retain anatomy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 198.14175)">Need independent and privacy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 217.812)">QA</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 237.247875)">Test held-out real-task utility</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="285.755625" transform="rotate(-0 15.84 285.755625)">02 Translation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 314.079375)">Source domain -&gt; target domain</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 333.749625)">Learn a conditional mapping</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 353.419875)">Keep relevant subject identity</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 373.090125)">Pairing changes assumptions</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="285.755625" transform="rotate(-0 351.36 285.755625)">Image-to-image translation</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 314.079375)">Source -&gt; target appearance</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 334.012875)">pix2pix; CycleGAN</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 353.946375)">Keep scene / object structure</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 373.616625)">Test subject-wise preservation</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="285.999375" transform="rotate(-0 686.88 285.999375)">Synthetic CT / virtual stain</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 313.835625)">MRI -&gt; CT; tissue -&gt; stain</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 333.2715)">MR-only RT; virtual histology</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 353.205)">Need subject-specific fidelity</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 373.152)">Test dose / pathology and QA</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="440.615" transform="rotate(-0 15.84 440.615)">03 Editing</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 468.879375)">Image + edit -&gt; modified image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 488.812875)">Change a specified property</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 508.483125)">Keep non-target content</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 528.153375)">Not a treatment counterfactual</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="440.555625" transform="rotate(-0 351.36 440.555625)">Instruction editing</text>
   </g>
   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 468.635625)">Image + instruction -&gt; edit</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 488.305875)">InstructPix2Pix</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 507.74175)">Keep identity outside the edit</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 527.67525)">Test target / off-target change</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="440.555625" transform="rotate(-0 686.88 440.555625)">Anatomic digital siblings</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 468.635625)">Local edit -&gt; related anatomy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 488.569125)">Diffusion-based local editing</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 508.239375)">Need controlled variation</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 527.67525)">Test local truth and invariants</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="595.355625" transform="rotate(-0 15.84 595.355625)">04 Restoration / fill</text>
   </g>
   <g id="text_25">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 623.435625)">Degraded input -&gt; restored</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 643.105875)">output</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 662.805)">Recover or fill missing content</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 682.7385)">Keep observed information</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 702.437625)">Separate truth from completion</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="595.599375" transform="rotate(-0 351.36 595.599375)">Denoise / enhance / inpaint</text>
   </g>
   <g id="text_27">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 623.435625)">Partial image -&gt; restored image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 643.105875)">Palette; DDRM</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 662.54175)">Keep supported detail</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 681.977625)">Test false structures</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="595.599375" transform="rotate(-0 686.88 595.599375)">Microscopy / region filling</text>
   </g>
   <g id="text_29">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 623.435625)">Degraded to enhanced content</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 643.369125)">Microscopy; MAISI tumor fill</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 663.302625)">Separate recovery / simulation</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 682.972875)">Test hallucination + task error</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="750.155625" transform="rotate(-0 15.84 750.155625)">05 Measurement inverse</text>
   </g>
   <g id="text_31">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 778.235625)">Data + operator -&gt; reconstruction</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 797.93475)">Infer a constrained posterior</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 817.370625)">Unobserved parts stay uncertain</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 837.040875)">Noise assumptions matter</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="750.155625" transform="rotate(-0 351.36 750.155625)">Inverse reconstruction</text>
   </g>
   <g id="text_33">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 778.235625)">Known operator -&gt; image draws</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 798.169125)">Diffusion posterior sampling</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 817.839375)">Keep likelihood-supported detail</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 837.5385)">Test operator shift / calibration</text>
   </g>
   <g id="text_34">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="750.399375" transform="rotate(-0 686.88 750.399375)">MRI / sparse-view CT</text>
   </g>
   <g id="text_35">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 778.479375)">k-space / projections -&gt; image</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 798.149625)">Score-based medical inversion</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 817.84875)">Need patient / lesion fidelity</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 837.519)">Test data shifts / decision error</text>
   </g>
   <g id="text_36">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="15.84" y="905.015" transform="rotate(-0 15.84 905.015)">06 Temporal generation</text>
   </g>
   <g id="text_37">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 933.035625)">Past / action -&gt; future states</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 952.4715)">Model dependent temporal states</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 972.170625)">Keep meaningful dynamics</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(15.84 991.840875)">Actions are optional conditions</text>
   </g>
   <g id="text_38">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="351.36" y="904.955625" transform="rotate(-0 351.36 904.955625)">Video / 4D / world models</text>
   </g>
   <g id="text_39">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 933.279375)">History / control -&gt; future view</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 953.212875)">Video diffusion; Genie; 4D-fy</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 973.146375)">Keep temporal / action relations</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(351.36 992.58225)">Test unseen actions</text>
   </g>
   <g id="text_40">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start" x="686.88" y="905.199375" transform="rotate(-0 686.88 905.199375)">Cardiac cycles / ultrasound</text>
   </g>
   <g id="text_41">
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 933.279375)">Phase / pose -&gt; anatomy / view</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 952.949625)">CHeart; Mesh Flow; SonoWorld</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 972.3855)">Need local motion / action truth</text>
    <text style="font-size: 20px; font-family: 'Arial'" transform="translate(686.88 992.084625)">Test against static / replay</text>
   </g>
  </g>
 </g>
