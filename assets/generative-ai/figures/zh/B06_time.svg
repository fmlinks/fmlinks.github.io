   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 310.4675)">两幅图像 -&gt; 中间帧</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 332.705875)">处理帧间大幅运动</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 354.94425)">保持两端的身份特征一致</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 377.182625)">检验遮挡 / 留出帧</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei'; text-anchor: start" x="686.88" y="280.2275" transform="rotate(-0 686.88 280.2275)">DDM 心脏 MR 插值</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(686.88 310.4675)">舒张期 / 收缩期 -&gt; 中间 MR</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(686.88 332.705875)">学习基于形变的路径</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(686.88 354.94425)">以源解剖 / 拓扑为目标</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(686.88 377.182625)">检验实际采集的中间时相</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei'; text-anchor: start" x="15.84" y="427.8275" transform="rotate(-0 15.84 427.8275)">21 动作 / 世界模型</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(15.84 458.0675)">历史 + 动作 -&gt; 下一状态</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(15.84 480.305875)">学习动力学，而非策略</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(15.84 502.54425)">保留对给定动作的响应</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(15.84 524.782625)">检验新动作 / 滚动生成漂移</text>
