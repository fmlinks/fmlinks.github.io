   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 458.0675)">历史帧 + 动作 -&gt; 帧</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 480.305875)">生成交互式滚动序列</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(351.36 502.54425)">在玩家输入下保持状态</text>
