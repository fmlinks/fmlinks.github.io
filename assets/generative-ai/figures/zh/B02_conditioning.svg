   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #148843" x="15.84" y="28.209375" transform="rotate(-0 15.84 28.209375)">02  条件与控制</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'; text-anchor: start" x="15.84" y="58.292813" transform="rotate(-0 15.84 58.292813)">图 1 坐标 2 | 子项 07, 08, 09</text>
