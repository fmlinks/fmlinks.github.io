   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei'; text-anchor: start" x="21.6" y="35.409375" transform="rotate(-0 21.6 35.409375)">从文献空白到决定性小规模试验</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'; text-anchor: start" x="21.6" y="73.608125" transform="rotate(-0 21.6 73.608125)">通用研究选题流程 | 正文展开四个医学案例</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #2573b4" x="21.6" y="118.209375" transform="rotate(-0 21.6 118.209375)">1  明确需求</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(21.6 177.35025)">人群与输入</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(21.6 199.588625)">所需不变量</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(21.6 221.827)">足以改变决策的误差</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(21.6 244.065375)">可用的独立真值</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei'; text-anchor: start" x="21.6" y="325.907812" transform="rotate(-0 21.6 325.907812)">这一误差能否测量？</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(21.6 404.788625)">否 -&gt; 收窄结论</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(21.6 427.027)">或建立验证资源</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #148843" x="360" y="118.209375" transform="rotate(-0 360 118.209375)">2  核实增量</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(360 177.35025)">最相近工作 + 同义词</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(360 199.588625)">已有成果是什么？</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(360 221.827)">缺少能力还是证据？</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(360 244.065375)">强常规基线</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei'; text-anchor: start" x="360" y="325.907812" transform="rotate(-0 360 325.907812)">增量能否检验？</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(360 404.788625)">否 -&gt; 修改问题</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(360 427.027)">不只是更换模型名</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #68559d" x="698.4" y="118.209375" transform="rotate(-0 698.4 118.209375)">3  开展小规模试验</text>
   </g>
   <g id="text_12">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 177.35025)">冻结数据划分与终点</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 199.588625)">纳入看似合理但错误的对照</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 221.827)">匹配数据与算力获取条件</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 244.065375)">预先指定停止规则</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 314.788625)">小规模试验能否改变</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 337.027)">有实质影响的结果？</text>
   </g>
   <g id="text_14">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 404.788625)">否 -&gt; 停止或收窄</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei'" transform="translate(698.4 427.027)">是 -&gt; 先消融，再扩展</text>
   </g>
  </g>
 </g>
